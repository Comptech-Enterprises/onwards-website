services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onward-website
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - nextjs_cache:/app/.next/cache
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0

volumes:
  nextjs_cache:
